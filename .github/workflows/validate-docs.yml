name: Validate documentation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# Newer pushes to the same pull request replace older runs. Runs on main always finish.
concurrency:
  group: validate-docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test validation rules
        run: npm run test:validators

      - name: Validate changed documentation
        if: github.event_name == 'pull_request'
        run: node scripts/validate.mjs --changed-from "${{ github.event.pull_request.base.sha }}"

      - name: Validate pushed documentation
        if: github.event_name != 'pull_request'
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          # A new branch push reports an all-zero "before" SHA, and a force-push can
          # leave "before" missing from the clone. In both cases git cannot resolve it.
          if [ -z "$BEFORE_SHA" ] || ! git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            node scripts/validate.mjs
          else
            node scripts/validate.mjs --changed-from "$BEFORE_SHA"
          fi

      - name: Build site
        run: npm run build
