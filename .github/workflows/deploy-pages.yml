name: Deploy to GitHub Pages

# GitHub Pages runs next to the CloudFront site while the team decides which host
# to keep. It is served from a sub-path, so it is built with its own baseUrl;
# the CloudFront build in infra/ is unaffected.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        env:
          DEPLOY_URL: https://${{ github.repository_owner }}.github.io
          DEPLOY_BASE_URL: /${{ github.event.repository.name }}/
        run: npm run build

      - name: Check build output
        run: |
          if [ -n "$(find build -name '*.html' -size 0)" ]; then
            echo "Empty HTML files found" >&2
            exit 1
          fi
          if find build -name '*.html' -exec grep -lP '\x00' {} + | grep -q .; then
            echo "NUL bytes found in built HTML" >&2
            exit 1
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
